# Promtail on the HOMELAB cluster — ships every node's logs to Loki on
# the local k3s. Loki is exposed via NodePort 30310 on the workstation.
#
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm repo update
#   helm --kube-context homelab upgrade --install promtail \
#     grafana/promtail \
#     -n monitoring --create-namespace \
#     -f monitoring/homelab/promtail-values.yaml

config:
  clients:
    - url: http://192.168.1.181:30310/loki/api/v1/push
      tenant_id: homelab

# Default Promtail config scrapes /var/log/pods/* and journald — fine.
# Add a `cluster` label so logs are distinguishable from k3os-local ones.
extraArgs:
  - -client.external-labels=cluster=homelab

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits:   { cpu: 200m, memory: 128Mi }
