# Production-grade Vault on the local k3s cluster.
#
# Shape:
#   - 3 replicas, integrated Raft storage (no Consul, no external KMS).
#   - Manual init + unseal (Shamir's secret sharing). Unseal keys + root
#     token kept by the operator out-of-band (password manager); they
#     are NEVER stored in this repo.
#   - TLS off for the home lab (cluster + LAN only). To enable, set
#     global.tlsDisable=false and provide certs.
#   - NodePort 30200 so consumers outside k3s (homelab cluster, CLI
#     from any LAN host) can reach Vault at http://192.168.1.181:30200.
#   - PVCs sized for real persistence — possible because gdragon has a
#     dedicated 100 GiB disk attached to /var.
#
# Deployed via ArgoCD — see argocd/vault.yaml.

global:
  enabled: true
  tlsDisable: true

# Sidecar injector OFF — we'll use External Secrets Operator for k8s
# secret materialization (easier retrofit for the helm charts we run).
injector:
  enabled: false

server:
  image:
    repository: "hashicorp/vault"
    tag: "1.20.4"

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  # Probes that tolerate "sealed" — manual unseal lifecycle.
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    initialDelaySeconds: 60

  # NodePort so:
  #   - homelab Prometheus / ESO can reach Vault at 192.168.1.181:30200
  #   - the `vault` CLI on gdragon can hit it the same way
  service:
    type: NodePort
    port: 8200
    targetPort: 8200
    nodePort: 30200

  # ── HA + Raft ───────────────────────────────────────────────────────
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = true
        }

        storage "raft" {
          path = "/vault/data"
        }

        # k8s service registration: stamps `vault-active` / `vault-standby`
        # labels on Pods so Services route only to the active leader.
        service_registration "kubernetes" {}

        # Prometheus telemetry on /v1/sys/metrics (auth needed by default;
        # an unauthenticated metrics endpoint is configured via the
        # ServiceMonitor below.)
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

  # ── Storage ─────────────────────────────────────────────────────────
  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: local-path
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: true
    size: 2Gi
    storageClass: local-path
    accessMode: ReadWriteOnce

  # Spread replicas across nodes when more than one is available.
  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault
                component: server
            topologyKey: kubernetes.io/hostname

# ServiceMonitor → kube-prometheus-stack discovers it (our values set
# serviceMonitorSelectorNilUsesHelmValues=false on Prometheus).
serverTelemetry:
  serviceMonitor:
    enabled: true
    interval: 30s

# Vault UI service — exposed via the NodePort above on /ui.
ui:
  enabled: true
  serviceType: NodePort
  serviceNodePort: 30200
  externalPort: 8200
