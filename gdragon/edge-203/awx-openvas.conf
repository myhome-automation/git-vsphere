# Edge nginx on gdragon-edge (192.168.1.203) for the gdragon mgmt/security
# tools. AWX + OpenVAS run on the gdragon k3s (192.168.1.181) behind Traefik
# (ClusterIP services + Ingress, NO NodePort). This box terminates HTTPS with
# the wildcard *.biplextech.com cert and reverse-proxies to Traefik on .181,
# preserving the Host header so Traefik host-routes to the right Ingress.
#
#   client --HTTPS--> 192.168.1.203 (this nginx, biplextech cert)
#                     --HTTP--> 192.168.1.181:80 (Traefik) -> svc
#
# TLS material (deployed out-of-band, NOT in git — it includes the private key):
#   /etc/nginx/ssl/biplextech.crt   (wildcard *.biplextech.com, cert+chain)
#   /etc/nginx/ssl/biplextech.key   (private key, mode 0600)
# Sourced from the cert-manager secret biplextech-tls (ingress-nginx ns).
#
# Deploy: /etc/nginx/conf.d/awx-openvas.conf ; nginx -t ; systemctl reload nginx
# DNS/hosts: awx.biplextech.com + openvas.biplextech.com -> 192.168.1.203.

upstream gdragon_traefik {
    server 192.168.1.181:80;
}

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    server_name awx.biplextech.com openvas.biplextech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name awx.biplextech.com;

    ssl_certificate     /etc/nginx/ssl/biplextech.crt;
    ssl_certificate_key /etc/nginx/ssl/biplextech.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;   # AWX uploads

    location / {
        proxy_pass http://gdragon_traefik;
        proxy_set_header Host              awx.biplextech.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name openvas.biplextech.com;

    ssl_certificate     /etc/nginx/ssl/biplextech.crt;
    ssl_certificate_key /etc/nginx/ssl/biplextech.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://gdragon_traefik;
        proxy_set_header Host              openvas.biplextech.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
    }
}
