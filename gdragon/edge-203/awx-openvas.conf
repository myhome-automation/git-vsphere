# Edge nginx on gdragon-edge (192.168.1.203) for the gdragon mgmt/security
# tools. AWX + OpenVAS run on the gdragon k3s (192.168.1.181) behind Traefik
# (ClusterIP services + Ingress, NO NodePort). This box reverse-proxies the
# two hostnames to Traefik on .181, preserving the Host header so Traefik
# host-routes to the right Ingress.
#
#   client -> 192.168.1.203 (this nginx) -> 192.168.1.181:80 (Traefik) -> svc
#
# Deploy: /etc/nginx/conf.d/awx-openvas.conf ; nginx -t ; systemctl enable --now nginx
# DNS/hosts must point awx.biplextech.com + openvas.biplextech.com -> .203.

upstream gdragon_traefik {
    server 192.168.1.181:80;
}

server {
    listen 80;
    server_name awx.biplextech.com;

    # AWX is websocket-heavy (live job output); allow large uploads.
    client_max_body_size 100m;

    location / {
        proxy_pass http://gdragon_traefik;
        proxy_set_header Host              awx.biplextech.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name openvas.biplextech.com;

    location / {
        proxy_pass http://gdragon_traefik;
        proxy_set_header Host              openvas.biplextech.com;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
    }
}
