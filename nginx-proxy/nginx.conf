# Path-based reverse proxy in front of all k3s + homelab services.
# Both nginx containers run this same file.
#
# Apps reachable via:
#   http://<host>/grafana/     → 192.168.1.181:30300
#   http://<host>/prometheus/  → 192.168.1.181:30320
#   http://<host>/loki/        → 192.168.1.181:30310
#   http://<host>/vault/       → 192.168.1.181:30200
#   http://<host>/argocd/      → 192.168.1.181:30401
#   http://<host>/             → landing page
#
# This file lives at /etc/podman-proxy/nginx.conf on host 192.168.1.203
# and is mounted read-only into both nginx containers.

upstream grafana    { server 192.168.1.181:30300; }
upstream prometheus { server 192.168.1.181:30320; }
upstream loki       { server 192.168.1.181:30310; }
upstream vault      { server 192.168.1.181:31326; }   # vault-active NodePort (leader-only); generic :30200 includes sealed pods
upstream argocd     { server 192.168.1.181:30401; }

server {
  listen 80 default_server;
  server_name _;

  # ── landing page ──────────────────────────────────────────────
  location = / {
    default_type text/html;
    return 200 '<!doctype html><html><head><title>home-lab proxy</title>
<style>body{font-family:sans-serif;max-width:600px;margin:3em auto;padding:0 1em}
li{margin:.4em 0} code{background:#eee;padding:2px 6px;border-radius:3px}</style>
</head><body><h1>home-lab proxy ($hostname)</h1>
<ul>
<li><a href="/grafana/">Grafana</a> — metrics + log dashboards</li>
<li><a href="/prometheus/">Prometheus</a> — TSDB queries</li>
<li><a href="/loki/ready">Loki</a> — log API (no UI; use via Grafana)</li>
<li><a href="/vault/ui/">Vault</a> — secret management</li>
<li><a href="/argocd/">ArgoCD</a> — GitOps app management</li>
</ul></body></html>';
  }

  # ── Grafana ───────────────────────────────────────────────────
  # Grafana is configured with serve_from_sub_path=true + root_url=/grafana/
  # (see monitoring/local-k3s/kube-prometheus-stack-values.yaml grafana.grafana.ini),
  # so it expects to SEE the /grafana/ prefix in the URI it receives.
  # → proxy_pass without trailing slash, to preserve the prefix.
  location /grafana/ {
    proxy_pass http://grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # ── Prometheus ────────────────────────────────────────────────
  # Prometheus is configured with externalUrl=http://<host>/prometheus and
  # routePrefix=/prometheus, so it serves under /prometheus/.
  # → proxy_pass without trailing slash, to preserve the prefix.
  location /prometheus/ {
    proxy_pass http://prometheus;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Loki ──────────────────────────────────────────────────────
  # Loki only serves under /loki/api/v1/* and /ready, /metrics. No UI,
  # no path-prefix awareness; we strip /loki/ here because Loki's
  # endpoints live at root (/ready, /metrics) and under /loki/api/v1/.
  location /loki/ {
    proxy_pass http://loki/;
    proxy_set_header Host $host;
  }

  # ── Vault ─────────────────────────────────────────────────────
  # Vault has NO native sub-path support (no equivalent of Grafana's
  # serve_from_sub_path). Strategy here:
  #   1. Strip /vault/ when forwarding (proxy_pass with trailing slash)
  #   2. Rewrite Location: / → /vault/ in responses so redirects stay
  #      inside the proxy mount
  #   3. The UI's absolute fetches (/v1/..., /ui/...) inside the SPA
  #      will still bypass /vault/ — full UI use needs the direct
  #      NodePort URL (http://192.168.1.181:31326/ui/).
  # API requests (curl-style, /vault/v1/...) work end-to-end.
  location /vault/ {
    proxy_pass http://vault/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    # Rewrite absolute Location headers back into /vault/ space.
    proxy_redirect ~^/(.*)$ /vault/$1;
  }

  # ── ArgoCD ────────────────────────────────────────────────────
  # ArgoCD is configured with server.rootpath=/argocd (set in
  # argocd-cmd-params-cm) and serves at /argocd/. Preserve the prefix.
  location /argocd/ {
    proxy_pass http://argocd;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # gRPC-Web upgrade for argocd CLI
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
