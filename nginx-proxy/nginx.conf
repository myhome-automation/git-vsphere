# Path-based reverse proxy in front of all k3s + homelab services.
# Both nginx containers run this same file.
#
# Apps reachable via:
#   http://<host>/grafana/     → 192.168.1.181:30300
#   http://<host>/prometheus/  → 192.168.1.181:30320
#   http://<host>/loki/        → 192.168.1.181:30310
#   http://<host>/vault/       → 192.168.1.181:30200
#   http://<host>/argocd/      → 192.168.1.181:30401
#   http://<host>/             → landing page
#
# This file lives at /etc/podman-proxy/nginx.conf on host 192.168.1.203
# and is mounted read-only into both nginx containers.

upstream grafana    { server 192.168.1.181:30300; }
upstream prometheus { server 192.168.1.181:30320; }
upstream loki       { server 192.168.1.181:30310; }
upstream vault      { server 192.168.1.181:30200; }
upstream argocd     { server 192.168.1.181:30401; }

server {
  listen 80 default_server;
  server_name _;

  # ── landing page ──────────────────────────────────────────────
  location = / {
    default_type text/html;
    return 200 '<!doctype html><html><head><title>home-lab proxy</title>
<style>body{font-family:sans-serif;max-width:600px;margin:3em auto;padding:0 1em}
li{margin:.4em 0} code{background:#eee;padding:2px 6px;border-radius:3px}</style>
</head><body><h1>home-lab proxy ($hostname)</h1>
<ul>
<li><a href="/grafana/">Grafana</a> — metrics + log dashboards</li>
<li><a href="/prometheus/">Prometheus</a> — TSDB queries</li>
<li><a href="/loki/ready">Loki</a> — log API (no UI; use via Grafana)</li>
<li><a href="/vault/ui/">Vault</a> — secret management</li>
<li><a href="/argocd/">ArgoCD</a> — GitOps app management</li>
</ul></body></html>';
  }

  # ── Grafana ───────────────────────────────────────────────────
  # Grafana needs `grafana.ini` -> [server] root_url + serve_from_sub_path = true.
  # See monitoring/local-k3s/kube-prometheus-stack-values.yaml grafana.grafana.ini.
  location /grafana/ {
    proxy_pass http://grafana/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  # ── Prometheus ────────────────────────────────────────────────
  # Needs --web.external-url=http://<host>/prometheus/ --web.route-prefix=/
  location /prometheus/ {
    proxy_pass http://prometheus/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ── Loki ──────────────────────────────────────────────────────
  # Loki only serves under /loki/api/v1/* and /ready, /metrics. No UI.
  location /loki/ {
    proxy_pass http://loki/;
    proxy_set_header Host $host;
  }

  # ── Vault ─────────────────────────────────────────────────────
  # Vault UI at /ui; API at /v1. Path-prefix-aware by default.
  location /vault/ {
    proxy_pass http://vault/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # ── ArgoCD ────────────────────────────────────────────────────
  # ArgoCD needs --rootpath=/argocd (passed via argocd-cmd-params-cm).
  location /argocd/ {
    proxy_pass http://argocd/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # gRPC-Web upgrade for argocd CLI
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
