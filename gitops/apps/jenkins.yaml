apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.9.28
      helm:
        valueFiles:
          - $values/gitops/values/jenkins.yaml
    - repoURL: https://github.com/myhome-automation/git-vsphere.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    # CIS hardening enforces PodSecurity `restricted` cluster-wide, but the
    # Jenkins chart's init/config-reload containers don't set drop:[ALL]/seccomp
    # so jenkins-0 was rejected. Jenkins needs no privileged/host access, so
    # `baseline` is the right posture: blocks privileged/hostNetwork/hostPath/etc
    # while permitting normal CI pods. (Harden to `restricted` later by setting
    # per-container securityContext in the chart values.)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: baseline
        pod-security.kubernetes.io/audit: baseline
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
