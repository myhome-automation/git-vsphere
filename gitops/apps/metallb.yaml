apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    # Bare-metal LoadBalancer. Must be healthy before ingress-nginx (wave 1)
    # so the ingress Service can get a LoadBalancer IP from the pool. The
    # external HAProxy/keepalived VIP .50 forwards to that IP (no NodePort).
    # Chain: Cloudflare -> HAProxy(VIP .50) -> MetalLB IP -> ingress-nginx -> app.
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.14.9
      helm:
        valueFiles:
          - $values/gitops/values/metallb.yaml
    - repoURL: https://github.com/myhome-automation/git-vsphere.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
