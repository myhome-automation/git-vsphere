apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Core platform — storage, secrets, mesh, policy, observability, CI.
  sourceRepos:
    - https://github.com/myhome-automation/git-vsphere.git
    - https://metallb.github.io/metallb
    - https://charts.longhorn.io
    - https://charts.jetstack.io
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.external-secrets.io
    - https://helm.releases.hashicorp.com
    - https://open-policy-agent.github.io/gatekeeper/charts
    - https://prometheus-community.github.io/helm-charts
    - https://charts.jenkins.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  # Platform components install CRDs + cluster-scoped RBAC, so allow cluster resources.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
