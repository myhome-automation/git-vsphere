# Vault Secrets Operator ("vault controller") — syncs Vault secrets into native
# k8s Secrets via CRDs (VaultStaticSecret / VaultDynamicSecret / VaultAuth).
# Default connection points at the in-cluster Vault service.
defaultVaultConnection:
  enabled: true
  address: "http://vault.vault.svc.cluster.local:8200"
  skipTLSVerify: true
controller:
  replicas: 1
  manager:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { memory: 128Mi }
