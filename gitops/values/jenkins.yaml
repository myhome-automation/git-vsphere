# Jenkins — CI. Controller + ephemeral k8s agents (no idle executors) to keep
# the resource footprint small. Path-based: https://biplextech.com/jenkins
controller:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { memory: 1Gi }
  serviceType: ClusterIP
  jenkinsUriPrefix: /jenkins
  jenkinsUrl: https://biplextech.com/jenkins
  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: biplextech.com
    path: /jenkins
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
  # Admin creds from an out-of-band Secret (NOT in git). Created live:
  #   kubectl -n jenkins create secret generic jenkins-admin-credentials \
  #     --from-literal=jenkins-admin-user=admin --from-literal=jenkins-admin-password=<pw>
  # (rotate via Vault/VSO later). Keys: jenkins-admin-user / jenkins-admin-password.
  admin:
    existingSecret: jenkins-admin-credentials
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password
persistence:
  enabled: true
  storageClass: longhorn
  size: 8Gi
agent:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }
