# Longhorn replicated block storage — the cluster's default StorageClass.
# 3 workers; replica count 2 to balance redundancy against the tight disk budget.
persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain
defaultSettings:
  defaultReplicaCount: 2
  defaultDataPath: /var/lib/longhorn
  storageMinimalAvailablePercentage: 15
  # Over-provision 200%: disks reserve 30% + the sum of REQUESTED replica sizes
  # was ~hitting the 100% cap (only ~1.6 Gi schedulable) -> new replicas failed
  # `insufficient storage` even with ~50 Gi actually free. Actual usage is low,
  # so over-committing is safe here and lets vault/consul/etc. volumes schedule.
  storageOverProvisioningPercentage: 200
# Disable the pre-upgrade hook job: on a fresh ArgoCD install it runs before the
# chart's ServiceAccount exists and fails ("longhorn-service-account not found"),
# blocking the whole Longhorn sync. Not needed for a first install.
preUpgradeChecker:
  jobEnabled: false
service:
  ui:
    type: ClusterIP
# HOST-based: the Longhorn UI has no native sub-path, so path routing
# (/longhorn) loads a blank page (assets reference absolute /). Serve it at
# longhorn.biplextech.com (DNS -> .50 on .203 dnsmasq); TLS via wildcard.
ingress:
  enabled: true
  ingressClassName: nginx
  host: longhorn.biplextech.com
  path: /
  pathType: Prefix
  # NO rewrite-target: host-based serves the UI at / and it uses RELATIVE asset
  # paths (./styles.css etc.). A leftover `rewrite-target: /$2` mangled those ->
  # assets 404 -> white screen. (rewrite was only for the old /longhorn path.)
  annotations: {}
