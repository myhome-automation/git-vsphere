# Vault HA with integrated Raft storage, 3 replicas, PVCs on Longhorn.
# AFTER first sync, Vault is sealed+uninitialized — run the init/unseal/raft-join
# procedure (see gitops/README.md). Vault Secrets Operator (wave 4) consumes it.
global:
  tlsDisable: true # intra-cluster plain HTTP; TLS terminates at the edge gateway
server:
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = 1
        }
        storage "raft" {
          path = "/vault/data"
          # retry_join so vault-1/2 auto-join the cluster on every (re)start —
          # critical for a frequently-rebooted home server (no manual raft join).
          retry_join { leader_api_addr = "http://vault-0.vault-internal:8200" }
          retry_join { leader_api_addr = "http://vault-1.vault-internal:8200" }
          retry_join { leader_api_addr = "http://vault-2.vault-internal:8200" }
        }
        service_registration "kubernetes" {}
        # AUTO-UNSEAL via the transit engine on the always-on gdragon Vault
        # (gdragon/vault-transit). No more manual unseal on every cold boot.
        # The Vault token is injected via the VAULT_TOKEN env (extraSecretEnvironmentVars
        # below, from secret vault-transit-token) — NOT committed to git.
        seal "transit" {
          address         = "http://192.168.1.181:8200"
          key_name        = "autounseal"
          mount_path      = "transit/"
          disable_renewal = "false"
          tls_skip_verify = "true"
        }
  # Token for the transit seal — value lives in the out-of-band secret
  # vault-transit-token (created live, never in git).
  extraSecretEnvironmentVars:
    - envName: VAULT_TOKEN
      secretName: vault-transit-token
      secretKey: token
  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: longhorn
  auditStorage:
    enabled: true
    size: 2Gi
    storageClass: longhorn
  # Only 3 workers — relax hard anti-affinity so all 3 replicas can schedule.
  affinity: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }
  # Stay Running while sealed (lesson from the old k3s Vault: sealedcode=204).
  # Probes are deliberately TOLERANT: on these small/loaded workers a SEALED
  # standby pod responds slowly, and the chart-default liveness (timeout 3s,
  # failureThreshold 2) SIGKILLs it mid-unseal -> crashloop that resets the
  # unseal (cold-boot trap, 2026-06-24). Wide thresholds let sealed pods survive
  # long enough to be unsealed; an unsealed pod responds fast so this is moot.
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    timeoutSeconds: 10
    failureThreshold: 12
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 12
  # HOST-based (vault.biplextech.com): the Vault UI hard-codes /ui, so path-based
  # routing (/vault -> redirect /ui/) 404s. Host-based serves the UI cleanly at /.
  # TLS via the ingress default *.biplextech.com wildcard cert. DNS record for
  # vault.biplextech.com -> .50 added on the .203 dnsmasq (dns_biplextech.yml).
  ingress:
    enabled: true
    ingressClassName: nginx
    pathType: Prefix
    hosts:
      - host: vault.biplextech.com
        paths:
          - /
ui:
  enabled: true
  serviceType: ClusterIP
# Using Vault Secrets Operator instead of the agent sidecar injector.
injector:
  enabled: false
