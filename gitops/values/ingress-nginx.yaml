# Single cluster ingress controller. Exposed as a MetalLB LoadBalancer
# (pinned 192.168.1.51) — NO NodePort. The external HAProxy/keepalived VIP
# 192.168.1.50 forwards :80/:443 to this LB IP; Cloudflare fronts HAProxy.
# Chain: Cloudflare -> HAProxy(VIP .50) -> MetalLB .51 -> ingress-nginx -> app.
controller:
  kind: Deployment
  replicaCount: 2
  service:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/address-pool: homelab-pool
    loadBalancerIP: 192.168.1.51
  ingressClassResource:
    name: nginx
    default: true
  # Serve the wildcard biplextech.com cert on EVERY ingress by default, so all
  # apps get HTTPS with one cert without per-Ingress TLS blocks. The secret is
  # the cert-manager-issued *.biplextech.com wildcard (biplextech-tls).
  extraArgs:
    default-ssl-certificate: ingress-nginx/biplextech-tls
  config:
    use-forwarded-headers: "true"
    proxy-body-size: "50m"
    # Trust the external gateway's X-Forwarded-* headers.
    proxy-real-ip-cidr: "192.168.1.0/24"
    # Force HTTP -> HTTPS across all apps.
    ssl-redirect: "true"
    force-ssl-redirect: "true"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { memory: 256Mi }
  metrics:
    enabled: true
  admissionWebhooks:
    enabled: true
    # Cold-boot safety: fail-open so Ingress applies don't get rejected while the
    # controller is still starting after a power cycle (home server reboots often).
    failurePolicy: Ignore
defaultBackend:
  enabled: false
