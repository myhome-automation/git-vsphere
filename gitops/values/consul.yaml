# Consul (Connect) — service mesh + service discovery + KV. Replaces Istio.
global:
  name: consul
  datacenter: biplextech
  tls:
    enabled: false
  metrics:
    enabled: true
  # Enable ACLs: the server-acl-init job bootstraps the ACL system and stores the
  # bootstrap token in secret `consul-bootstrap-acl-token` (key `token`). Component
  # tokens (servers, connect-inject, etc.) are issued automatically by the chart.
  acls:
    manageSystemACLs: true
server:
  replicas: 3
  storageClass: longhorn
  storage: 3Gi
  affinity: "" # only 3 workers — relax hard anti-affinity
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }
# Connect service mesh (opt-in per workload via annotation; not default-on).
connectInject:
  enabled: true
  default: false
  # CRITICAL: never let a not-ready injector wedge the whole cluster. With the
  # default failurePolicy=Fail, if the injector pod is down (e.g. waiting on
  # storage) EVERY pod create cluster-wide is rejected. Ignore = fail-open.
  failurePolicy: Ignore
ui:
  enabled: true
  service:
    type: ClusterIP
  # HOST-based (consul.biplextech.com): the Consul UI redirects to /ui, so
  # path-based routing 404s. Host-based serves it cleanly at /. TLS via the
  # ingress default *.biplextech.com wildcard. DNS record on .203 dnsmasq.
  ingress:
    enabled: true
    ingressClassName: nginx
    pathType: Prefix
    hosts:
      - host: consul.biplextech.com
        paths:
          - /
