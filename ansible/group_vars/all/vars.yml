---
# Non-secret defaults — safe to commit.
# Secrets live in vault.yml (ansible-vault encrypted).

timezone: "America/Chicago"
domain:   "biplextech.com"

# Authoritative DNS for biplextech.com runs on the repurposed vault-server VM.
dns_server: "192.168.1.202"

# ingress-nginx is exposed via MetalLB (LoadBalancer), pinned to this IP.
# HAProxy on lb1/lb2 (VIP below) forwards :80/:443 here — NO NodePort.
# Chain: Cloudflare -> HAProxy(VIP) -> MetalLB ingress_lb_ip -> ingress-nginx -> app.
ingress_lb_ip: "192.168.1.51"

dhcp_range_start: "192.168.1.100"
dhcp_range_end:   "192.168.1.200"
dhcp_lease_time:  "12h"
dhcp_router:      "192.168.1.1"

upstream_dns:
  - "8.8.8.8"
  - "8.8.4.4"

vip:          "192.168.1.50"
http_port:    80
https_port:   443
k8s_api_port: 6443
k8s_version:  "1.36"
pod_network_cidr: "10.0.0.0/16"   # avoid home network 192.168.1.0/24; Calico IPPool matches

# Thin wrappers — reference vault vars so playbooks use plain names
keepalived_password: "{{ vault_keepalived_password }}"
