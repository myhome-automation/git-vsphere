---
# Kubernetes worker nodes (kworker1/2/3).
# Run base.yml first, then k8s_master.yml, then this playbook.
# Requires the join command from kubeadm init output on kmaster1.
- name: k8s_worker | install container runtime and kubeadm
  hosts: k8s_workers
  become: true

  # All vars come from group_vars/all/vars.yml

  tasks:
    - name: load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: persist kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: set sysctl params for k8s networking
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { key: net.bridge.bridge-nf-call-iptables,  value: "1" }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { key: net.ipv4.ip_forward,                  value: "1" }

    - name: disable swap
      command: swapoff -a
      changed_when: true

    - name: remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: add docker-ce repo (containerd source)
      get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo

    - name: install containerd
      dnf:
        name: containerd.io
        state: present

    # See k8s_master.yml: Rocky's shipped config disables CRI which makes
    # kubeadm fail. Always regenerate from `containerd config default`.
    - name: generate default containerd config (CRI enabled)
      shell: containerd config default > /etc/containerd/config.toml
      notify: restart containerd

    - name: set SystemdCgroup = true in containerd config
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: restart containerd

    - name: enable and start containerd
      systemd:
        name: containerd
        state: started
        enabled: true

    - name: add kubernetes repo
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/rpm/repodata/repomd.xml.key

    - name: install kubeadm kubelet
      dnf:
        name:
          - kubeadm
          - kubelet
        state: present
        disable_excludes: kubernetes

    - name: enable kubelet
      systemd:
        name: kubelet
        enabled: true

    # ── Firewall rules (worker ports) ────────────────────────────────────────
    - name: open worker firewall ports
      firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - 10250/tcp     # kubelet API
        - 30000-32767/tcp  # NodePort services
        - 179/tcp       # Calico BGP
        - 5473/tcp      # Calico Typha
        - 4789/udp      # Calico VXLAN

    # See k8s_master.yml + docs/calico.md — without this, pod-to-pod across
    # nodes is blocked by firewalld and BIRD reports "BGP not established".
    - name: trust pod CIDR ({{ pod_network_cidr }})
      firewalld:
        source: "{{ pod_network_cidr }}"
        zone: trusted
        state: enabled
        permanent: true
        immediate: true

    # The trusted zone above only matches by SOURCE, so it does NOT cover the
    # host->pod direction (source = node IP). Forwarded traffic needs a
    # firewalld POLICY. Without it, kube-apiserver->pod / node->pod break after
    # any firewalld reload. See docs/calico.md.
    - name: allow forwarded pod-CIDR traffic via firewalld policy
      script: files/calico-firewalld-policy.sh {{ pod_network_cidr }}
      register: calico_fwd_policy
      changed_when: "'POLICY_CHANGED' in calico_fwd_policy.stdout"

  handlers:
    - name: restart containerd
      systemd:
        name: containerd
        state: restarted

# ── Join workers to cluster ──────────────────────────────────────────────────
# Retrieve the join command from kmaster1 and run it on each worker.
- name: k8s_worker | join cluster
  hosts: k8s_workers
  become: true

  tasks:
    - name: check if node already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: get join command from kmaster1
      command: kubeadm token create --print-join-command
      delegate_to: kmaster1
      register: join_command
      when: not kubelet_conf.stat.exists
      changed_when: false

    - name: join cluster
      command: "{{ join_command.stdout }}"
      when: not kubelet_conf.stat.exists
