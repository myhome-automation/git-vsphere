---
# DNS + DHCP server (dns1).
# Uses dnsmasq for both DNS forwarding and DHCP.
# Static DHCP leases map each VM's MAC to a fixed IP.
- name: dns_dhcp | configure dnsmasq
  hosts: dns_dhcp
  become: true

  # All vars come from group_vars/all/vars.yml

  tasks:
    - name: install dnsmasq
      dnf:
        name: dnsmasq
        state: present

    - name: write dnsmasq config
      copy:
        dest: /etc/dnsmasq.conf
        content: |
          domain={{ domain }}
          local=/{{ domain }}/
          expand-hosts

          # upstream resolvers
          {% for ns in upstream_dns %}
          server={{ ns }}
          {% endfor %}

          # DHCP pool
          dhcp-range={{ dhcp_range_start }},{{ dhcp_range_end }},{{ dhcp_lease_time }}
          dhcp-option=option:router,{{ dhcp_router }}
          dhcp-option=option:dns-server,{{ ansible_host }}

          # log queries for debugging
          log-queries
          log-dhcp
        mode: "0644"
      notify: restart dnsmasq

    - name: add cluster hostnames to /etc/hosts (dnsmasq reads this)
      blockinfile:
        path: /etc/hosts
        marker: "# {mark} k8s cluster"
        block: |
          # Masters
          # kmaster1   192.168.1.x
          # kmaster2   192.168.1.x
          # kmaster3   192.168.1.x
          # Workers
          # kworker1   192.168.1.x
          # kworker2   192.168.1.x
          # kworker3   192.168.1.x
          # Load balancers
          # lb1        192.168.1.x
          # lb2        192.168.1.x

    - name: open DNS firewall port
      firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - dns
        - dhcp

    - name: enable and start dnsmasq
      systemd:
        name: dnsmasq
        state: started
        enabled: true

  handlers:
    - name: restart dnsmasq
      systemd:
        name: dnsmasq
        state: restarted
