---
# Full cluster provisioning — run after terraform apply.
#
# Usage:
#   cd ansible/
#   ansible-playbook playbooks/site.yml
#
# Run individual stages:
#   ansible-playbook playbooks/site.yml --tags base
#   ansible-playbook playbooks/site.yml --tags dns
#   ansible-playbook playbooks/site.yml --tags lb
#   ansible-playbook playbooks/site.yml --tags k8s

- import_playbook: base.yml
  tags: [base]

# dns.yml supersedes the older dns_dhcp.yml — internal DNS is now served
# from lb1 (dnsmasq + myhomelab.com forward/reverse). dns1 is unused.
- import_playbook: dns.yml
  tags: [dns]

- import_playbook: loadbalancer.yml
  tags: [lb]

- import_playbook: k8s_master.yml
  tags: [k8s, k8s_master]

- import_playbook: k8s_worker.yml
  tags: [k8s, k8s_worker]

# Replace Flannel (installed at master init) with Calico for NetworkPolicy
# and Istio-compatible CNI behavior.
- import_playbook: cni_calico.yml
  tags: [k8s, calico, cni]

# Service mesh.
- import_playbook: istio.yml
  tags: [k8s, istio, mesh]
