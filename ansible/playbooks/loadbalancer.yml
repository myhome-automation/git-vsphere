---
# Load balancer nodes (lb1, lb2) — HAProxy fronting k8s API + ingress.
# keepalived MASTER/BACKUP pair owns VIP 192.168.1.50.
# Each host's role is set in inventory via keepalived_state /
# keepalived_priority (MASTER=101 on lb1, BACKUP=100 on lb2).
- name: loadbalancer | install HAProxy and keepalived
  hosts: loadbalancers
  become: true

  # Non-secret vars come from group_vars/all/vars.yml (auto-loaded locally via
  # the inventory/group_vars symlink; supplied as inventory vars under AWX).
  # The keepalived auth password lives encrypted in vault.yml — load it
  # explicitly so the secret resolves both locally and under AWX (decrypted at
  # runtime by the Vault credential) without ever importing it into inventory.
  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/vault.yml"

  tasks:
    - name: install haproxy and keepalived
      dnf:
        name:
          - haproxy
          - keepalived
        state: present

    # ── HAProxy ─────────────────────────────────────────────────────────────
    - name: write haproxy config
      copy:
        dest: /etc/haproxy/haproxy.cfg
        content: |
          global
            log /dev/log local0
            maxconn 4096
            daemon

          defaults
            log     global
            mode    tcp
            option  tcplog
            option  dontlognull
            timeout connect 5s
            timeout client  50s
            timeout server  50s

          # ── k8s API server ──────────────────────────────────────────────
          frontend k8s_api
            bind *:{{ k8s_api_port }}
            default_backend k8s_masters

          backend k8s_masters
            balance roundrobin
            option tcp-check
            server kmaster1 {{ hostvars['kmaster1'].ansible_host }}:{{ k8s_api_port }} check
            server kmaster2 {{ hostvars['kmaster2'].ansible_host }}:{{ k8s_api_port }} check
            server kmaster3 {{ hostvars['kmaster3'].ansible_host }}:{{ k8s_api_port }} check

          # ── HTTP ingress ────────────────────────────────────────────────
          # Forward to the MetalLB LoadBalancer IP of ingress-nginx
          # ({{ ingress_lb_ip }}) — NOT worker NodePorts. Chain:
          # Cloudflare -> here (VIP {{ vip }}) -> MetalLB {{ ingress_lb_ip }}
          # -> ingress-nginx -> app. TCP passthrough; TLS terminates at ingress.
          frontend http_in
            bind *:{{ http_port }}
            default_backend ingress_http

          backend ingress_http
            server ingress_lb {{ ingress_lb_ip }}:80 check

          # ── HTTPS ingress ───────────────────────────────────────────────
          frontend https_in
            bind *:{{ https_port }}
            default_backend ingress_https

          backend ingress_https
            server ingress_lb {{ ingress_lb_ip }}:443 check

          # ── HAProxy stats ───────────────────────────────────────────────
          frontend stats
            bind *:8404
            mode http
            stats enable
            stats uri /stats
            stats refresh 10s
        mode: "0644"
      notify: restart haproxy

    # ── keepalived (VIP failover) ────────────────────────────────────────────
    # MASTER/BACKUP pair. Per-host state and priority come from inventory
    # vars (keepalived_state, keepalived_priority). Interface auto-detected
    # via ansible facts (ens192 on vmxnet3, not eth0).
    - name: write keepalived config
      copy:
        dest: /etc/keepalived/keepalived.conf
        content: |
          vrrp_instance VI_1 {
            state {{ keepalived_state }}
            interface {{ ansible_default_ipv4.interface }}
            virtual_router_id 51
            priority {{ keepalived_priority }}
            advert_int 1
            authentication {
              auth_type PASS
              auth_pass {{ keepalived_password }}
            }
            virtual_ipaddress {
              {{ vip }}
            }
          }
        mode: "0644"
      notify: restart keepalived

    # ── Firewall ─────────────────────────────────────────────────────────────
    - name: open LB firewall ports
      firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - "{{ k8s_api_port }}/tcp"
        - "{{ http_port }}/tcp"
        - "{{ https_port }}/tcp"
        - "8404/tcp"    # HAProxy stats

    - name: allow VRRP for keepalived
      firewalld:
        protocol: vrrp
        permanent: true
        state: enabled
        immediate: true

    - name: enable IP forwarding for LB
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/lb.conf
        reload: true

    # SELinux blocks haproxy from binding to non-standard ports (6443 for
    # the k8s API frontend, 8404 for stats). This boolean allows haproxy
    # to bind/connect to arbitrary ports.
    - name: allow haproxy to bind any port (SELinux)
      seboolean:
        name: haproxy_connect_any
        state: true
        persistent: true

    - name: enable and start haproxy
      systemd:
        name: haproxy
        state: started
        enabled: true

    - name: enable and start keepalived
      systemd:
        name: keepalived
        state: started
        enabled: true

  handlers:
    - name: restart haproxy
      systemd:
        name: haproxy
        state: restarted

    - name: restart keepalived
      systemd:
        name: keepalived
        state: restarted
