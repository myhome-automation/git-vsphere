---
# cluster_shutdown.yml — STRICTLY SERIAL graceful shutdown of the 8 cluster VMs.
#
# Each VM is gracefully shut down (VMware Tools) and must be fully Powered off
# BEFORE the next, in REVERSE dependency order so etcd drains cleanly and the
# VIP/LB stays up until last:
#   1. kworker3/2/1   — workers first
#   2. kmaster3/2/1   — control plane (etcd) next, kmaster1 last
#   3. lb2 -> lb1     — LB pair last (keepalived VIP holder lb1 very last)
#
# vault-server (.202) is decommissioned — not touched. Runs on localhost (ssh to
# ESXi via vim-cmd). Bounded grace (120s) then a hard power.off — never hangs.
#   ansible-playbook playbooks/cluster_shutdown.yml
- name: shutdown | strictly serial cluster power-off
  hosts: localhost
  gather_facts: false
  vars:
    esxi_host: 192.168.1.174
    shutdown_order:
      - { name: kworker3 }
      - { name: kworker2 }
      - { name: kworker1 }
      - { name: kmaster3 }
      - { name: kmaster2 }
      - { name: kmaster1 }
      - { name: lb2 }
      - { name: lb1 }
  tasks:
    - name: STRICTLY SERIAL shutdown (each VM Powered off before the next)
      include_tasks: _shutdown_one.yml
      loop: "{{ shutdown_order }}"
      loop_control:
        loop_var: poweroff
        label: "{{ poweroff.name }}"

    - name: shutdown complete
      debug:
        msg: >
          All 8 cluster VMs Powered off in order. vault-server (.202) left as-is.
          Mgmt tier (gdragon k3s + .203 edge) still running. Next: power off ESXi
          (.174) -> gdragon (.181) -> gdragon-edge/DNS (.203) last.
