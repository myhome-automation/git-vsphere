---
# cluster_shutdown.yml
#
# Gracefully shut down the 8 CLUSTER VMs only. vault-server is left
# alone (it's a separate workload).
#
# Order:
#   1. workers (drain not needed since we're powering off)
#   2. dns + lb
#   3. masters
#
# To ALSO shut down vault-server, run `all_shutdown.yml` instead.
#
# Usage:
#   ansible-playbook playbooks/cluster_shutdown.yml
#
# To power the cluster back on:
#   ansible-playbook playbooks/cluster_powerup.yml
- name: shutdown | workers first
  hosts: k8s_workers
  become: true
  gather_facts: false
  tasks:
    - name: schedule 30s shutdown
      shell: nohup sh -c 'sleep 5 && /sbin/shutdown -h now' >/dev/null 2>&1 &
      async: 1
      poll: 0

- name: shutdown | dns + loadbalancer
  hosts: dns_dhcp:loadbalancers
  become: true
  gather_facts: false
  tasks:
    - name: schedule shutdown
      shell: nohup sh -c 'sleep 10 && /sbin/shutdown -h now' >/dev/null 2>&1 &
      async: 1
      poll: 0

- name: shutdown | masters
  hosts: k8s_masters
  become: true
  gather_facts: false
  tasks:
    - name: schedule shutdown
      shell: nohup sh -c 'sleep 15 && /sbin/shutdown -h now' >/dev/null 2>&1 &
      async: 1
      poll: 0

- name: shutdown | report
  hosts: localhost
  gather_facts: false
  tasks:
    - debug:
        msg: |
          Cluster VMs shutdown dispatched. Off in ~25 seconds.
          vault-server LEFT RUNNING. To verify:
            ssh root@192.168.1.174 'vim-cmd vmsvc/getallvms | while read v _; do
              case $v in [0-9]*) printf "%s " $v; vim-cmd vmsvc/power.getstate $v | tail -1;; esac; done'
          To bring cluster back: ansible-playbook playbooks/cluster_powerup.yml
