---
# cluster_powerup.yml — STRICTLY SERIAL power-on of the 8 cluster VMs.
#
# Each VM is powered on and must be SSH-reachable BEFORE the next one starts, in
# dependency order so nothing races or deadlocks:
#   1. lb1 (.188, keepalived VIP MASTER)   — control-plane endpoint .50 must exist
#   2. lb2 (.185, BACKUP)                     before any master tries to join
#   3. kmaster1/2/3                          — etcd members come up one at a time
#   4. kworker1/2/3                          — workers last
#
# vault-server (.202) is decommissioned — not touched. Runs on localhost (ssh to
# ESXi via vim-cmd, since the VMs are off). Waits are BOUNDED (fail, never hang).
#   ansible-playbook playbooks/cluster_powerup.yml
- name: powerup | strictly serial cluster power-on
  hosts: localhost
  gather_facts: false
  vars:
    esxi_host: 192.168.1.174
    boot_order:
      - { name: lb1,      ip: 192.168.1.188 }
      - { name: lb2,      ip: 192.168.1.185 }
      - { name: kmaster1, ip: 192.168.1.186 }
      - { name: kmaster2, ip: 192.168.1.189 }
      - { name: kmaster3, ip: 192.168.1.187 }
      - { name: kworker1, ip: 192.168.1.182 }
      - { name: kworker2, ip: 192.168.1.183 }
      - { name: kworker3, ip: 192.168.1.184 }
  tasks:
    - name: ESXi maintenance-mode pre-check
      shell: >
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@{{ esxi_host }}
        "vim-cmd hostsvc/runtimeinfo | awk -F'\"' '/inMaintenanceMode/ {print $2}'"
      register: maint_check
      changed_when: false

    - name: fail fast if ESXi is in maintenance mode
      fail:
        msg: >
          ESXi {{ esxi_host }} is in MAINTENANCE MODE — power.on silently fails.
          Run: ssh root@{{ esxi_host }} 'vim-cmd hostsvc/maintenance_mode_exit'
      when: "'true' in maint_check.stdout"

    - name: STRICTLY SERIAL power-on (each VM SSH-ready before the next)
      include_tasks: _poweron_one.yml
      loop: "{{ boot_order }}"
      loop_control:
        loop_var: poweron
        label: "{{ poweron.name }} ({{ poweron.ip }})"

    - name: powerup complete
      debug:
        msg: >
          All 8 cluster VMs up + SSH-reachable, in order. k8s API at
          https://192.168.1.50:6443 settles in ~1 min (kubelet + static pods).
