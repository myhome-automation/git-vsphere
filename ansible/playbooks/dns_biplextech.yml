---
# dns_biplextech.yml
#
# Authoritative DNS for biplextech.com via dnsmasq, on the ALWAYS-ON Ubuntu edge
# box (.203, inventory group [dns] -> gdragon-edge). Moved here 2026-06-24 OFF the
# ex-vault-server .202 VM: .202 lived on the often-rebooted, clock-skewing ESXi
# cluster, so tying LAN name resolution to it was fragile. The .203 edge box boots
# first and independently of ESXi, and already fronts AWX/OpenVAS. In-cluster
# CoreDNS stays scoped to cluster-internal names only (making the cluster the LAN
# resolver would be a circular cold-boot dependency).
#   biplextech.com -> 192.168.1.50  (keepalived VIP / edge gateway, path-based)
# Node A records added for ops convenience; everything else forwarded upstream.
# All cluster hosts are then pointed at .203 for DNS.
#
#   ANSIBLE_CONFIG=$PWD/ansible.cfg ansible-playbook playbooks/dns_biplextech.yml
#
# OS-portable: edge is Ubuntu (apt + ufw + conf-dir disabled by default); the old
# .202 was Rocky (dnf + firewalld). Tasks branch on ansible_os_family.
- name: dns | authoritative biplextech.com on the always-on edge box (.203)
  hosts: dns
  become: true
  vars:
    internal_domain: "{{ domain }}" # biplextech.com
    dns_records:
      - { name: biplextech.com, ip: "{{ vip }}" } # apex -> edge VIP (path-based)
      - { name: kmaster1, ip: 192.168.1.186 }
      - { name: kmaster2, ip: 192.168.1.189 }
      - { name: kmaster3, ip: 192.168.1.187 }
      - { name: kworker1, ip: 192.168.1.182 }
      - { name: kworker2, ip: 192.168.1.183 }
      - { name: kworker3, ip: 192.168.1.184 }
      - { name: lb1, ip: 192.168.1.188 }
      - { name: lb2, ip: 192.168.1.185 }
      - { name: dns, ip: 192.168.1.203 } # DNS now lives on the edge box
      # gdragon mgmt/security apps are front-ended by the .203 edge nginx
      # (.203 -> .181 Traefik -> AWX/OpenVAS). local=/biplextech.com/ means
      # unlisted names NXDOMAIN (not forwarded), so these MUST be explicit.
      - { name: awx.biplextech.com, ip: 192.168.1.203 }
      - { name: openvas.biplextech.com, ip: 192.168.1.203 }
      # Platform apps with HOST-based ingress (UIs that 404 under path routing)
      # -> the edge VIP .50. (argocd/grafana/prometheus/jenkins stay path-based
      # on the apex biplextech.com.)
      - { name: vault.biplextech.com, ip: 192.168.1.50 }
      - { name: consul.biplextech.com, ip: 192.168.1.50 }
      - { name: grafana.biplextech.com, ip: 192.168.1.50 }
      - { name: longhorn.biplextech.com, ip: 192.168.1.50 }
  tasks:
    - name: install dnsmasq (full pkg; Ubuntu ships only dnsmasq-base)
      package:
        name: dnsmasq
        state: present

    # Ubuntu's /etc/dnsmasq.conf ships every conf-dir line commented out, so
    # /etc/dnsmasq.d/*.conf is NOT read until we enable it. (Rocky's is already
    # active.) Harmless/idempotent on Rocky.
    - name: enable conf-dir so /etc/dnsmasq.d/*.conf is read (Ubuntu default off)
      lineinfile:
        path: /etc/dnsmasq.conf
        regexp: '^\s*#?\s*conf-dir=/etc/dnsmasq\.d/,\*\.conf\s*$'
        line: 'conf-dir=/etc/dnsmasq.d/,*.conf'
      notify: restart dnsmasq

    - name: ensure hosts dir exists (outside conf-dir)
      file:
        path: /etc/dnsmasq.hosts.d
        state: directory
        mode: "0755"

    # Rocky 9's /etc/dnsmasq.conf ships `bind-interfaces` uncommented, which
    # conflicts with our `bind-dynamic` (dnsmasq: "cannot set --bind-interfaces
    # and --bind-dynamic" -> refuses to start). Disable it in the default conf.
    - name: disable bind-interfaces in default dnsmasq.conf (conflicts w/ bind-dynamic)
      replace:
        path: /etc/dnsmasq.conf
        regexp: '^bind-interfaces\s*$'
        replace: '#bind-interfaces  # disabled: biplextech.conf uses bind-dynamic'
      notify: restart dnsmasq

    # The apex entry is written verbatim; short names get the domain suffix via
    # expand-hosts. dnsmasq auto-generates PTR records from these.
    - name: write biplextech.com zone hosts file
      copy:
        dest: /etc/dnsmasq.hosts.d/biplextech.hosts
        mode: "0644"
        content: |
          {% for r in dns_records %}
          {{ r.ip }} {{ r.name if '.' in r.name else r.name ~ '.' ~ internal_domain }}
          {% endfor %}
      notify: restart dnsmasq

    - name: write dnsmasq config
      copy:
        dest: /etc/dnsmasq.d/biplextech.conf
        mode: "0644"
        content: |
          # Authoritative for {{ internal_domain }} only; no DHCP.
          domain={{ internal_domain }}
          local=/{{ internal_domain }}/
          expand-hosts

          # addn-hosts is the only A-record source (ignore /etc/hosts).
          no-hosts
          addn-hosts=/etc/dnsmasq.hosts.d/biplextech.hosts

          # Listen on loopback + this host's primary address ONLY (never
          # 127.0.0.53) so we coexist with systemd-resolved on the Ubuntu edge
          # box — resolved owns 127.0.0.53:53 for the box's own lookups.
          listen-address=127.0.0.1,{{ ansible_default_ipv4.address }}
          # bind-dynamic (NOT bind-interfaces): on a cold boot dnsmasq can start
          # before this host's IP is assigned -> bind-interfaces fails hard with
          # "Cannot assign requested address". bind-dynamic binds as addresses
          # appear, so dnsmasq survives the boot race. (Requires bind-interfaces
          # be disabled in the default /etc/dnsmasq.conf — handled below.)
          bind-dynamic

          # Forward everything else upstream.
          no-resolv
          {% for s in upstream_dns %}
          server={{ s }}
          {% endfor %}

          cache-size=1000
          log-queries
          log-facility=/var/log/dnsmasq.log
      notify: restart dnsmasq

    - name: open DNS ports 53 (firewalld — RedHat)
      firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 53/tcp
        - 53/udp
      when: ansible_os_family == "RedHat"

    - name: open DNS ports 53 (ufw — Debian/Ubuntu, only if ufw enabled)
      community.general.ufw:
        rule: allow
        port: "53"
        proto: "{{ item }}"
      loop:
        - tcp
        - udp
      when: ansible_os_family == "Debian"
      failed_when: false

    - name: enable and start dnsmasq
      systemd:
        name: dnsmasq
        state: started
        enabled: true

  handlers:
    - name: restart dnsmasq
      systemd:
        name: dnsmasq
        state: restarted

# ── Point every host at .202 for DNS ────────────────────────────────────────
- name: dns | set resolver to the biplextech.com DNS server on all hosts
  hosts: everyone
  become: true
  vars:
    # Primary: the authoritative DNS (.202). Secondary: an upstream resolver so
    # external lookups survive a .202 outage.
    dns_servers: "{{ dns_server }} {{ upstream_dns[0] }}"
  tasks:
    - name: find primary NetworkManager connection
      shell: >
        nmcli -t -f NAME,DEVICE connection show --active |
        awk -F: -v iface="{{ ansible_default_ipv4.interface }}" '$2==iface {print $1; exit}'
      register: nm_conn
      changed_when: false

    - name: set DNS via NetworkManager (override DHCP)
      command: >
        nmcli connection modify "{{ nm_conn.stdout }}"
        ipv4.dns "{{ dns_servers }}"
        ipv4.dns-search "{{ domain }}"
        ipv4.ignore-auto-dns yes
      register: nm_modify
      changed_when: true

    - name: reapply connection to push DNS change
      command: nmcli connection up "{{ nm_conn.stdout }}"
      when: nm_modify is changed
