---
# cni_calico.yml
#
# Replace the default Flannel CNI (installed by k8s_master.yml on first
# init) with Calico (Tigera operator + custom resource). Calico gives us
# NetworkPolicy support and is the default CNI for Istio's installation
# requirements.
#
# Idempotent: re-running just re-applies the manifests (kubectl apply).
#
# Reference: https://docs.tigera.io/calico/latest/getting-started/kubernetes/quickstart
- name: calico | install Calico CNI (replace Flannel)
  hosts: kmaster1
  become: true
  vars:
    calico_version: v3.30.4
    # Pod CIDR chosen to NOT collide with home LAN (192.168.1.0/24).
    # Calico runs its own IPAM, so this doesn't have to match the
    # kubeadm --pod-network-cidr used at init time.
    pod_cidr: 10.0.0.0/16
  environment:
    KUBECONFIG: /root/.kube/config

  tasks:
    - name: remove flannel (if present)
      command: kubectl delete -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml --ignore-not-found
      changed_when: false

    - name: wait briefly for flannel pods to terminate
      command: kubectl wait --for=delete pod -l app=flannel -n kube-flannel --timeout=60s
      register: flannel_wait
      changed_when: false
      failed_when: false

    - name: install Tigera operator
      command: kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
      register: tigera_install
      changed_when: tigera_install.rc == 0
      failed_when: tigera_install.rc != 0 and 'AlreadyExists' not in tigera_install.stderr

    # Tigera operator pod takes ~10-30 s to register the operator.tigera.io
    # CRDs. Applying Installation CR before then fails with
    # "no matches for kind Installation in version operator.tigera.io/v1".
    - name: wait for tigera-operator deployment to be available
      command: kubectl -n tigera-operator wait --for=condition=available --timeout=180s deployment/tigera-operator
      register: tigera_op_ready
      changed_when: false

    - name: wait for operator CRDs to register
      command: kubectl get crd installations.operator.tigera.io
      register: crd_check
      retries: 30
      delay: 5
      until: crd_check.rc == 0
      changed_when: false

    - name: write Calico Installation CR (uses our pod CIDR)
      copy:
        dest: /root/calico-installation.yaml
        owner: root
        group: root
        mode: '0644'
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
              - blockSize: 26
                cidr: {{ pod_cidr }}
                encapsulation: VXLANCrossSubnet
                natOutgoing: Enabled
                nodeSelector: all()
          ---
          apiVersion: operator.tigera.io/v1
          kind: APIServer
          metadata:
            name: default
          spec: {}

    - name: apply Calico installation
      command: kubectl apply -f /root/calico-installation.yaml
      register: calico_apply
      changed_when: "'unchanged' not in calico_apply.stdout"

    - name: wait for Calico to be ready (up to 5 min)
      command: kubectl wait --for=condition=Ready tigerastatus/calico --timeout=300s
      register: calico_ready
      changed_when: false
      failed_when: false

    - name: show calico status
      command: kubectl get tigerastatus
      register: tigera_status
      changed_when: false

    - debug:
        var: tigera_status.stdout_lines
