---
# all_powerup.yml
#
# Power on EVERY VM (vault-server + 8 cluster). Use after a full host
# reboot or after `all_shutdown.yml` was run.
#
# Order: vault-server first (so DNS via lb1 dependency chain works
# even though DNS is actually on lb1, vault is brought up first for
# consistency with the documented dependency order).
#
# For cluster-only powerup (assumes vault-server already running), use
# cluster_powerup.yml instead.
#
# Usage:
#   ansible-playbook playbooks/all_powerup.yml
- name: powerup | start vault-server first via ESXi vim-cmd
  hosts: localhost
  gather_facts: false
  vars:
    esxi_host: 192.168.1.174
  tasks:
    - name: get vault-server vmid
      shell: |
        ssh -o StrictHostKeyChecking=no root@{{ esxi_host }} \
          "vim-cmd vmsvc/getallvms | awk '\$2==\"vault-server\" {print \$1}'"
      register: vault_vmid
      changed_when: false

    - name: power on vault-server (skip if on)
      shell: |
        ssh -o StrictHostKeyChecking=no root@{{ esxi_host }} \
          "state=\$(vim-cmd vmsvc/power.getstate {{ vault_vmid.stdout }} | tail -1); \
           if [ \"\$state\" != 'Powered on' ]; then \
             vim-cmd vmsvc/power.on {{ vault_vmid.stdout }}; echo started; \
           else echo already_on; fi"
      register: vault_pon
      changed_when: "'started' in vault_pon.stdout"

    - name: wait for vault-server SSH
      wait_for:
        host: 192.168.1.202
        port: 22
        timeout: 300

# Now bring up the cluster.
- import_playbook: cluster_powerup.yml

# ── Post-powerup hygiene ─────────────────────────────────────────────────
# Force chronyd to step the clock immediately. VMware Tools sets the VM
# clock from the ESXi host on boot; if the ESXi host clock has drifted,
# the VMs come up with the same drift and chrony's normal slew is too
# slow to recover (the safety threshold is 1000s). Step explicitly.
# Symptom this prevents: Prometheus rejects remote_write samples as
# "out of order", `up{}` queries return empty even though scrape works.
- name: powerup | sync clocks via chronyc makestep
  hosts: everyone
  become: true
  gather_facts: false
  tasks:
    - name: chronyc makestep (force immediate clock step)
      command: chronyc makestep
      register: makestep
      changed_when: "'200 OK' in makestep.stdout"
      failed_when: false

# ── Health summary ───────────────────────────────────────────────────────
- name: powerup | report cluster health
  hosts: localhost
  gather_facts: false
  tasks:
    - name: probe k8s API via VIP
      uri:
        url: "https://192.168.1.50:6443/healthz"
        validate_certs: false
        timeout: 10
      register: api_health
      retries: 12
      delay: 5
      until: api_health.status == 200
      failed_when: false

    - name: probe DNS via VIP
      shell: dig @192.168.1.50 kmaster1.myhomelab.com +short +time=3 +tries=1
      register: dns_probe
      changed_when: false
      failed_when: false

    - debug:
        msg: |
          ====== Cluster reachability ======
          k8s API @ https://192.168.1.50:6443/healthz : {{ 'OK' if api_health.status == 200 else 'FAIL (' ~ (api_health.status | default('no response')) ~ ')' }}
          DNS  @ 192.168.1.50  kmaster1.myhomelab.com  : {{ dns_probe.stdout | default('no answer') }}

          Next step: ensure Calico BGP is established before scheduling new pods.
            kubectl --context homelab -n calico-system get pods
          If calico-node pods show 0/1, see docs/calico.md C1 (firewalld).
