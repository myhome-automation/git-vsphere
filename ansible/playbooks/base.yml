---
# Run on every VM immediately after Terraform provisions it.
# Extends LVM to fill the full disk, sets hostname, hardens SSH,
# and installs common packages.
- name: base | bootstrap all cluster nodes
  hosts: cluster
  become: true

  tasks:
    # ── Disk: extend LVM to fill any free disk space ────────────────────────
    # vault-server (source for clones) uses VG `rlm` with LVs root/var/apps/home.
    # If the underlying vmdk was extended (vmkfstools -X), growpart+pvresize+lvol
    # reclaims it. If the disk wasn't extended, these become no-ops.
    - name: install growpart
      dnf:
        name: cloud-utils-growpart
        state: present

    - name: extend LVM PV partition (sda2)
      command: growpart /dev/sda 2
      register: growpart_out
      failed_when: growpart_out.rc not in [0, 1]
      changed_when: "'CHANGED' in growpart_out.stdout"

    - name: resize LVM physical volume
      command: pvresize /dev/sda2
      changed_when: true

    - name: detect main VG name
      shell: vgs --noheadings -o vg_name | head -1 | tr -d ' '
      register: main_vg
      changed_when: false

    - name: check VG has free space
      shell: vgs --noheadings -o vg_free --units b {{ main_vg.stdout }} | awk '{print $1+0}'
      register: vg_free_bytes
      changed_when: false

    # Extend /var (where /var/lib/containerd lives) only if VG has spare blocks.
    - name: extend var LV with all free space
      community.general.lvol:
        vg: "{{ main_vg.stdout }}"
        lv: var
        size: +100%FREE
        resizefs: true
      when: (vg_free_bytes.stdout | int) > 1073741824   # > 1 GiB free worth extending

    # ── Hostname ────────────────────────────────────────────────────────────
    - name: set hostname to inventory name
      hostname:
        name: "{{ inventory_hostname }}"

    - name: update /etc/hosts with own name
      lineinfile:
        path: /etc/hosts
        regexp: "^127.0.1.1"
        line: "127.0.1.1 {{ inventory_hostname }}"
        insertafter: "^127.0.0.1"

    # ── SSH: lock down root + enforce key-only auth ──────────────────────────
    - name: disable root SSH login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PermitRootLogin"
        line: "PermitRootLogin no"
      notify: restart sshd

    - name: disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PasswordAuthentication"
        line: "PasswordAuthentication no"
      notify: restart sshd

    # ── Common packages ─────────────────────────────────────────────────────
    - name: install common packages
      dnf:
        name:
          - vim
          - tmux
          - git
          - curl
          - wget
          - lvm2
          - bash-completion
          - net-tools
          - bind-utils
          - tcpdump
          - nfs-utils
        state: present

    - name: full system update
      dnf:
        name: "*"
        state: latest
      tags: update

    # ── Disable IPv6 ────────────────────────────────────────────────────────
    # Cluster operates IPv4-only. Disable at runtime (sysctl) AND at boot
    # (grub kernel cmdline) so it stays off across reboots and so dhclient
    # / NetworkManager don't try to acquire a v6 lease.
    - name: persist ipv6 disable via sysctl
      copy:
        dest: /etc/sysctl.d/99-disable-ipv6.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          net.ipv6.conf.lo.disable_ipv6 = 1
      notify: reload sysctl

    - name: disable ipv6 on kernel cmdline (grub)
      command: grubby --update-kernel=ALL --args="ipv6.disable=1"
      register: grubby_out
      changed_when: '"ipv6.disable=1" not in grubby_out.stdout'

    # ── Firewall: ensure firewalld is running ────────────────────────────────
    - name: enable and start firewalld
      systemd:
        name: firewalld
        state: started
        enabled: true

    # ── Timezone ────────────────────────────────────────────────────────────
    - name: set timezone to America/Chicago
      timezone:
        name: America/Chicago

    # ── open-vm-tools: ensure running so ESXi can read IP ───────────────────
    - name: ensure open-vm-tools is running
      systemd:
        name: vmtoolsd
        state: started
        enabled: true

  handlers:
    - name: restart sshd
      systemd:
        name: sshd
        state: restarted

    - name: reload sysctl
      command: sysctl --system
