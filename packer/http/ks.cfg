#version=RHEL9
text
skipx

# Locale / keyboard
lang en_US.UTF-8
keyboard --xlayouts='us'
timezone America/Chicago --utc

# Network — DHCP during install; Ansible sets static IPs after provisioning
network --bootproto=dhcp --device=link --activate
network --hostname=localhost.localdomain

# Accounts — ${build_password} is injected by Packer templatefile() at build time.
# The value comes from packer.pkrvars.hcl (gitignored).
# Ansible base.yml disables PasswordAuthentication entirely after first boot.
rootpw --plaintext ${build_password}
user --name=ansible --groups=wheel --password=${build_password} --plaintext

# Boot loader — MBR on first disk
bootloader --location=mbr --boot-drive=sda

# Partitioning — MBR + LVM (BIOS mode on ESXi 6.7 + pvscsi)
zerombr
clearpart --all --initlabel

part /boot  --fstype=xfs   --size=1024 --ondisk=sda
part pv.01  --fstype=lvmpv --size=1 --grow --ondisk=sda

# Volume group
volgroup vg_system pv.01

# lv_root grows to fill remaining space; swap is fixed
logvol /    --fstype=xfs  --size=8192 --grow --vgname=vg_system --name=lv_root
logvol swap --fstype=swap --size=2048     --vgname=vg_system --name=lv_swap

# Minimal package set
%packages --ignoremissing --excludedocs
@^minimal-environment
openssh-server
python3
sudo
curl
wget
open-vm-tools
net-tools
bash-completion
-iwl*firmware
-aic94xx-firmware
-atmel-firmware
-b43-openfirmware
-bfa-firmware
-ipw*-firmware
-libertas*-firmware
%end

%post
# SSH hardening — Ansible will lock this down further
sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/'        /etc/ssh/sshd_config
sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
systemctl enable sshd

# Passwordless sudo for ansible user
echo 'ansible ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ansible
chmod 440 /etc/sudoers.d/ansible

# Enable open-vm-tools so ESXi/Terraform can read the VM IP
systemctl enable vmtoolsd

# Disable selinux enforcing during initial automation — Ansible re-enables it
sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config

# Clean yum cache
dnf clean all
rm -rf /var/cache/dnf
%end

reboot
