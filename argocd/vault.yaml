# ArgoCD Application: HashiCorp Vault on the local k3s cluster.
#
# Values come from vault/values.yaml in this repo.
# Bootstrap:
#   kubectl --context k3os-local apply -f argocd/vault.yaml
# Then init + unseal once (manual one-time step — see vault/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  # Don't let ArgoCD delete the Vault data when the Application is
  # deleted — PVCs would go too.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.31.0
    helm:
      valueFiles: []
      values: |
        # Values are inlined here AND mirrored in vault/values.yaml for
        # readability. To change Vault config, edit vault/values.yaml,
        # then copy the body into the `values:` block below and commit.
        #
        # (When the repo grows an `argocd/sources` setup we'll switch
        # this to `valueFiles: [../vault/values.yaml]` + multi-source.)
        global:
          enabled: true
          tlsDisable: true
        injector:
          enabled: false
        server:
          image:
            repository: "hashicorp/vault"
            tag: "1.20.4"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            enabled: true
            path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
          livenessProbe:
            enabled: true
            path: "/v1/sys/health?standbyok=true"
            initialDelaySeconds: 60
          service:
            type: NodePort
            port: 8200
            targetPort: 8200
            nodePort: 30200
          ha:
            enabled: true
            replicas: 3
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true
                listener "tcp" {
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_disable = true
                }
                storage "raft" {
                  path = "/vault/data"
                }
                service_registration "kubernetes" {}
                telemetry {
                  prometheus_retention_time = "30s"
                  disable_hostname = true
                }
          dataStorage:
            enabled: true
            size: 5Gi
            storageClass: local-path
            accessMode: ReadWriteOnce
          auditStorage:
            enabled: true
            size: 2Gi
            storageClass: local-path
            accessMode: ReadWriteOnce
          affinity: |
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: vault
                        component: server
                    topologyKey: kubernetes.io/hostname
        serverTelemetry:
          serviceMonitor:
            enabled: true
            interval: 30s
        ui:
          enabled: true
          serviceType: NodePort
          serviceNodePort: 30200
          externalPort: 8200
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
